# Runs on every push and pull request to main: the same checks as before a release.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, types, unit tests, dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint -- --max-warnings 0
      - run: npm run typecheck
      - run: npm test
      # Production dependencies only: build tools may carry advisories that never reach the server.
      - run: npm audit --omit=dev --audit-level=high

  e2e:
    name: Production build and end-to-end tests
    runs-on: ubuntu-latest
    needs: checks
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # The Playwright config builds the app and starts it in demo mode with isolated data.
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  compose:
    name: Docker compose (PostgreSQL, migrate, web, worker, backup and restore)
    runs-on: ubuntu-latest
    needs: checks
    timeout-minutes: 30
    env:
      COMPOSE: docker compose -f deploy/docker-compose.yml --env-file deploy/.env
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: |
          cp deploy/.env.example deploy/.env
          sed -i "s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=ci-$(openssl rand -hex 12)|" deploy/.env
          sed -i "s|^VIGIL_ADMIN_EMAIL=.*|VIGIL_ADMIN_EMAIL=admin@ci.example|" deploy/.env
          sed -i "s|^VIGIL_ADMIN_PASSWORD=.*|VIGIL_ADMIN_PASSWORD=ci-initial-password-123|" deploy/.env
          sed -i "s|^NEXORA_URL=.*|NEXORA_URL=|" deploy/.env
          echo "APP_RELEASE=${{ github.sha }}" >> deploy/.env
      - name: Build and start
        run: $COMPOSE up -d --build
      - name: Wait until the web app is ready
        run: |
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:3300/api/health; then echo; exit 0; fi
            sleep 2
          done
          $COMPOSE ps; $COMPOSE logs --tail=100; exit 1
      - name: Smoke test
        run: |
          set -e
          test "$($COMPOSE ps -a migrate --format '{{.ExitCode}}')" = 0
          test "$($COMPOSE ps worker --format '{{.State}}')" = running
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3300/login)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3300/incidents)" = 307
          # Production mode: no demo accounts and no demo password on the sign-in page.
          ! curl -s http://localhost:3300/login | grep -q "vigil-demo-2026"
          test "$($COMPOSE exec -T db psql -U vigil -d vigil -tAc 'select count(*) from rules')" = 15
          test "$($COMPOSE exec -T db psql -U vigil -d vigil -tAc "select count(*) from users where email = 'admin@ci.example' and must_change_password")" = 1
      - name: Backup and restore into a fresh database
        run: |
          set -e
          $COMPOSE run --rm backup "sh /backup.sh /backups"
          file=$(ls -1t deploy/backups/vigil-*.dump | head -1)
          $COMPOSE exec -T db createdb -U vigil restore_check
          $COMPOSE run --rm -e PGDATABASE=restore_check backup "pg_restore --no-owner --exit-on-error -d restore_check /backups/$(basename $file)"
          for t in rules rule_versions users settings; do
            a=$($COMPOSE exec -T db psql -U vigil -d vigil -tAc "select count(*) from $t")
            b=$($COMPOSE exec -T db psql -U vigil -d restore_check -tAc "select count(*) from $t")
            echo "$t: $a vs $b"; test "$a" = "$b"
          done
      - name: Logs on failure
        if: failure()
        run: $COMPOSE logs --tail=200

